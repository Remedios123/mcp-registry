location = /authorize {
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cas_browser_upstream http://cas-shim:8085;
    proxy_pass $cas_browser_upstream;
}

location = /cas/callback {
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cas_browser_upstream http://cas-shim:8085;
    proxy_pass $cas_browser_upstream;
}

location = /renew {
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cas_browser_upstream http://cas-shim:8085;
    proxy_pass $cas_browser_upstream;
}
location ^~ /internal/business-token/ {
    return 404;
}
