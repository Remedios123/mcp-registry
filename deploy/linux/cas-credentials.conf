# Registry's private connection to the UC shim. Docker only publishes 8443.
server {
    listen 127.0.0.1:8093;
    server_name localhost;

    location ^~ /internal/business-token/ {
        access_log off;
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cas_credentials_backend http://cas-shim:8085;
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_pass $cas_credentials_backend;
    }

    location / {
        return 404;
    }
}
